{% extends "base.html" %}
{% block content %}

<h2>
    Enter product
</h2>

{% if error %}
{{ error }}
{% endif %}

<form method="post" action = "/products/new_product">

    <label>
        Product Name
        <input type="text" name="name" required>
    </label>
    <label>
        Availability
        <input type="checkbox" name="is_active" value="1" >
        
    </label><br>

    <label>
        Stock
        <input type="number" name="stock" required>
    </label>
    <label>
        Price
        <input type="text" name="price" required>
    </label>

    <button type="submit">Submit</button>
</form>

{% endblock %}
