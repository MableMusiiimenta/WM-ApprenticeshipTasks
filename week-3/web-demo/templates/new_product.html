{% extends "base.html" %}
{% block content %}

<h2>
    Enter product
</h2>

<form method="post" action = "/products/new_product">

    <label>
        Product Name
        <input type="text" name="name" required>
    </label>
    <label>
        Availability
        <input type="checkbox" name="is_active" value="1" >
        
    </label><br>

    <label>
        Stock
        <input type="number" name="stock" required>
    </label>
    <label>
        Price
        <input type="number" name="price" required>
    </label>

    <button type="submit">Submit</button>
</form>

{% if name is not defined %}
<p style="color: red;">Product name is required</p>
{% endif %}

{% if stock < 0 %}
<p style="color: red;">Enter valid stock</p>
{% endif %}

{% if price <= 0 %}
<p style="color: red;">Enter valid price</p>
{% endif %}

{% endblock %}
